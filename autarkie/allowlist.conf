# Positivliste ausgehender Verbindungen fuer die Vali-Appliance.
# Format: proto/port<TAB>purpose<TAB>hosts (hosts = "any" oder kommagetrennte
# Teilstrings, gegen die der Reverse-DNS-Hostname des Ziels geprueft wird).
#
# Diese Datei ist die EINZIGE Quelle der Wahrheit: setup-firewall.sh erzeugt
# daraus die ufw-Regeln, classify-connections.sh bewertet Beobachtungen
# dagegen. Aenderung hier reicht, keine zweite Stelle pflegen.
udp/53	dns	any
tcp/53	dns	any
udp/123	ntp	any
tcp/443	release-feed	github.com,objects.githubusercontent.com,codeload.github.com
