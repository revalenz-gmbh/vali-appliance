# Weiterleitungs-Proxy fuer das Update-Fenster: nur die Domains aus update-ziele.txt, nur HTTPS (CONNECT 443) und HTTP (80).
# Er lauscht nur auf der internen Bruecke und laeuft nur, solange das Fenster offen ist (update-fenster.service).
User tinyproxy
Group tinyproxy
Port 3129
Listen 10.77.0.1
Timeout 600
MaxClients 20
Allow 10.77.0.0/24
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/update-ziele.txt"
FilterExtended On
FilterDefaultDeny Yes
DisableViaHeader Yes
Syslog On
LogLevel Info
